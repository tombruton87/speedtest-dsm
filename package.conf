# Speedtest Tracker on the DSM app chassis. Read by chassis/build.sh and the tests.
PKG_NAME=speedtest
PKG_TITLE="Speedtest Tracker"
PKG_DESC="Speedtest Tracker, which tests your internet speed on a schedule and keeps the history, in Container Manager — with a DSM window for the latest results and averages, running a test now, the schedule and server, alerts in DSM when the line is slow or a test fails, a monthly CSV of every result in a shared folder, API tokens, HTTPS with DSM's certificate, backups and updates."
APP_ID="SpeedtestTracker.AppInstance"
REPO=tombruton87/speedtest-dsm
SERVICES="app"
VOLUMES="config"
IMAGE_VARS="ST_IMAGE"
PORT=8780
PORTS="8780 8781 8785 8099"
HEALTH_PATH=/api/healthcheck
APP_ACTIONS="runnow|schedule|limits|alerts|public|servers|mypw|token|untoken|historynow|refreshcert"
APP_ANSWER_KEYS="ADMIN_EMAIL ADMIN_NAME EVERY TLS"
APP_REQUEST_KEYS="EVERY SERVER_ID KEEP_DAYS LIM_DOWN LIM_UP LIM_PING NAME_B64 TOKEN_ID TOKEN_KIND TLS"
TAGLINE="internet speed"
WELCOME="Speedtest Tracker tests your internet connection on a schedule — download, upload, ping — and keeps every result, so you can see when the line is slow and show your provider. This package runs it in Container Manager, makes its default login yours, and adds a window to DSM: the latest results and averages, a test now, the schedule, and a DSM notification when a result is below what you pay for."
BACKUP_WHAT="every result, your account and settings (Speedtest Tracker's SQLite database), and the app key that protects them."
SITE_NOTE="The address you open Speedtest Tracker at. HTTPS can be served directly with DSM's own certificate (Control Panel → Security → Certificate, the system default; renewals are picked up daily) or a self-signed one."
ICON_TOP="#fbbf24"
ICON_BOTTOM="#d97706"
ICON_LETTER="S"   # only if icon.png is missing
BETA=yes
